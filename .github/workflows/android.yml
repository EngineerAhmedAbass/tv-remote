name: TV Remote APK

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TV-Remote.apk

      # التطبيق بيقرا الملف ده كل ما يتفتح عشان يعرف لو فيه نسخة أحدث
      - name: Version info
        run: |
          CODE=$(( ${{ github.run_number }} + 100 ))
          echo "{\"versionCode\": $CODE, \"versionName\": \"2.0.${{ github.run_number }}\", \"apk\": \"https://github.com/${{ github.repository }}/releases/download/latest/TV-Remote.apk\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-apk
          path: TV-Remote.apk

      # رابط ثابت لآخر نسخة: releases/download/latest/TV-Remote.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # امسح أي نسخة قديمة بنفس الـ tag (حتى لو اتسابت draft)
          for id in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.tag_name=="latest") | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" || true
          done
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/latest" || true
          gh release create latest TV-Remote.apk version.json \
            --target "${{ github.sha }}" \
            --latest \
            --title "ريموت TV (نسخة 2.0.${{ github.run_number }})" \
            --notes "نزّل TV-Remote.apk وسطّبه على الموبايل، وخلي الموبايل والتليفزيون على نفس الواي فاي."
          # أحيانًا GitHub بيسيبها draft — ننشرها ونتأكد
          for i in 1 2 3 4 5; do
            gh release edit latest --draft=false || true
            if curl -sfL -o /dev/null "https://github.com/${{ github.repository }}/releases/download/latest/version.json"; then
              echo "published"; exit 0
            fi
            sleep 5
          done
          echo "release is not public"; exit 1
